<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  svg {
    background-color: #ffffff;
  }
  .system-box {
    fill: #fafbfc;
    stroke: #24292f;
    stroke-width: 2.5;
    rx: 8;
  }
  .system-title {
    font-size: 18px;
    font-weight: bold;
    fill: #24292f;
    text-anchor: middle;
  }
  .actor-text {
    font-size: 14px;
    font-weight: bold;
    fill: #1f2328;
    text-anchor: middle;
  }
  .actor-stereotype {
    font-size: 11px;
    font-style: italic;
    fill: #57606a;
    text-anchor: middle;
  }
  .usecase {
    fill: #f6f8fa;
    stroke: #0969da;
    stroke-width: 2;
  }
  .usecase-text {
    font-size: 12px;
    font-weight: 600;
    fill: #1f2328;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .assoc-line {
    stroke: #24292f;
    stroke-width: 1.5;
  }
  .include-line {
    stroke: #0969da;
    stroke-width: 1.5;
    stroke-dasharray: 5, 5;
  }
  .include-label {
    font-size: 11px;
    font-style: italic;
    fill: #0969da;
    text-anchor: middle;
  }
</style>
</head>
<body>

<svg width="1100" height="820" viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg">
  <!-- Titulo Geral do Diagrama -->
  <text x="550" y="30" font-size="20" font-weight="bold" fill="#0969da" text-anchor="middle">Diagrama de Casos de Uso - Sistema de Matrícula Online (ETEC)</text>

  <!-- Limite do Sistema (Boundary) -->
  <rect x="230" y="55" width="620" height="740" class="system-box" />
  <text x="540" y="85" class="system-title">Sistema de Matrícula Online (ETEC)</text>

  <!-- ==================== ATORES (LADO ESQUERDO) ==================== -->
  
  <!-- Ator: Aluno (x=110, y=200) -->
  <g id="actor-aluno">
    <circle cx="110" cy="180" r="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <line x1="110" y1="196" x2="110" y2="235" stroke="#24292f" stroke-width="2"/>
    <line x1="85" y1="210" x2="135" y2="210" stroke="#24292f" stroke-width="2"/>
    <line x1="110" y1="235" x2="90" y2="270" stroke="#24292f" stroke-width="2"/>
    <line x1="110" y1="235" x2="130" y2="270" stroke="#24292f" stroke-width="2"/>
    <text x="110" y="295" class="actor-text">Aluno</text>
  </g>

  <!-- Ator: Professor (x=110, y=560) -->
  <g id="actor-professor">
    <circle cx="110" cy="540" r="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <line x1="110" y1="556" x2="110" y2="595" stroke="#24292f" stroke-width="2"/>
    <line x1="85" y1="570" x2="135" y2="570" stroke="#24292f" stroke-width="2"/>
    <line x1="110" y1="595" x2="90" y2="630" stroke="#24292f" stroke-width="2"/>
    <line x1="110" y1="595" x2="130" y2="630" stroke="#24292f" stroke-width="2"/>
    <text x="110" y="655" class="actor-text">Professor</text>
  </g>

  <!-- ==================== ATORES (LADO DIREITO) ==================== -->

  <!-- Ator: Secretaria Academica (x=970, y=230) -->
  <g id="actor-secretaria">
    <circle cx="970" cy="210" r="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <line x1="970" y1="226" x2="970" y2="265" stroke="#24292f" stroke-width="2"/>
    <line x1="945" y1="240" x2="995" y2="240" stroke="#24292f" stroke-width="2"/>
    <line x1="970" y1="265" x2="950" y2="300" stroke="#24292f" stroke-width="2"/>
    <line x1="970" y1="265" x2="990" y2="300" stroke="#24292f" stroke-width="2"/>
    <text x="970" y="325" class="actor-text">Secretaria</text>
    <text x="970" y="342" class="actor-text">Acadêmica</text>
  </g>

  <!-- Ator Secundario: Sistema de Pagamentos (x=970, y=570) -->
  <g id="actor-pagamentos">
    <rect x="900" y="550" width="140" height="65" fill="#f6f8fa" stroke="#24292f" stroke-width="2" rx="6"/>
    <text x="970" y="572" class="actor-stereotype">&lt;&lt;sistema externo&gt;&gt;</text>
    <text x="970" y="592" class="actor-text" font-size="13">Sistema de</text>
    <text x="970" y="607" class="actor-text" font-size="13">Pagamentos</text>
  </g>

  <!-- ==================== CASOS DE USO ==================== -->
  
  <!-- UC01: Cadastrar-se (cx=390, cy=130) -->
  <ellipse cx="390" cy="130" rx="100" ry="24" class="usecase" />
  <text x="390" y="130" class="usecase-text">Cadastrar-se</text>

  <!-- UC02: Visualizar Cursos (cx=400, cy=195) -->
  <ellipse cx="400" cy="195" rx="105" ry="24" class="usecase" />
  <text x="400" y="195" class="usecase-text">Visualizar Cursos</text>

  <!-- UC03: Realizar Matrícula (cx=400, cy=265) -->
  <ellipse cx="400" cy="265" rx="105" ry="24" class="usecase" />
  <text x="400" y="265" class="usecase-text">Realizar Matrícula</text>

  <!-- UC04: Consultar Notas e Histórico (cx=400, cy=335) -->
  <ellipse cx="400" cy="335" rx="115" ry="24" class="usecase" />
  <text x="400" y="335" class="usecase-text">Ver Notas e Histórico</text>

  <!-- UC05: Processar Taxas de Matrícula (cx=670, cy=310) -->
  <ellipse cx="670" cy="310" rx="120" ry="25" class="usecase" />
  <text x="670" y="310" class="usecase-text">Processar Taxas</text>

  <!-- UC06: Aprovar Matrículas (cx=680, cy=150) -->
  <ellipse cx="680" cy="150" rx="105" ry="24" class="usecase" />
  <text x="680" y="150" class="usecase-text">Aprovar Matrículas</text>

  <!-- UC07: Criar e Editar Cursos (cx=680, cy=220) -->
  <ellipse cx="680" cy="220" rx="110" ry="24" class="usecase" />
  <text x="680" y="220" class="usecase-text">Criar/Editar Cursos</text>

  <!-- UC08: Gerenciar Alunos e Professores (cx=670, cy=410) -->
  <ellipse cx="670" cy="410" rx="135" ry="25" class="usecase" />
  <text x="670" y="410" class="usecase-text">Gerenciar Alunos/Professores</text>

  <!-- UC09: Gerar Relatórios (cx=680, cy=490) -->
  <ellipse cx="680" cy="490" rx="105" ry="24" class="usecase" />
  <text x="680" y="490" class="usecase-text">Gerar Relatórios</text>

  <!-- UC10: Acessar Lista de Alunos (cx=400, cy=520) -->
  <ellipse cx="400" cy="520" rx="115" ry="24" class="usecase" />
  <text x="400" y="520" class="usecase-text">Acessar Lista de Alunos</text>

  <!-- UC11: Registrar Notas e Frequência (cx=410, cy=595) -->
  <ellipse cx="410" cy="595" rx="125" ry="25" class="usecase" />
  <text x="410" y="595" class="usecase-text">Registrar Notas e Frequência</text>

  <!-- UC12: Disponibilizar Materiais (cx=410, cy=670) -->
  <ellipse cx="410" cy="670" rx="120" ry="24" class="usecase" />
  <text x="410" y="670" class="usecase-text">Disponibilizar Materiais</text>

  <!-- ==================== LINHAS DE ASSOCIACAO ==================== -->

  <!-- Aluno -> UCs -->
  <line x1="135" y1="210" x2="295" y2="135" class="assoc-line" />
  <line x1="135" y1="215" x2="295" y2="195" class="assoc-line" />
  <line x1="135" y1="225" x2="298" y2="260" class="assoc-line" />
  <line x1="135" y1="235" x2="290" y2="330" class="assoc-line" />

  <!-- Include: Realizar Matricula -> Processar Taxas -->
  <line x1="505" y1="275" x2="560" y2="298" class="include-line" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0969da"/>
    </marker>
  </defs>
  <text x="535" y="278" class="include-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Processar Taxas -> Sistema de Pagamentos -->
  <line x1="790" y1="320" x2="900" y2="565" class="assoc-line" />

  <!-- Professor -> UCs -->
  <line x1="135" y1="565" x2="288" y2="525" class="assoc-line" />
  <line x1="135" y1="575" x2="285" y2="595" class="assoc-line" />
  <line x1="135" y1="585" x2="292" y2="665" class="assoc-line" />

  <!-- Secretaria Academica -> UCs -->
  <line x1="945" y1="240" x2="785" y2="155" class="assoc-line" />
  <line x1="945" y1="248" x2="790" y2="220" class="assoc-line" />
  <line x1="945" y1="260" x2="780" y2="395" class="assoc-line" />
  <line x1="945" y1="270" x2="780" y2="480" class="assoc-line" />
  <!-- Secretaria tambem aprova matricula que foi solicitada -->
  <line x1="945" y1="245" x2="505" y2="265" class="assoc-line" stroke-dasharray="2,2" stroke="#6e7781" />

</svg>

</body>
</html>
